<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#176b5b">
  <link rel="manifest" href="./manifest.webmanifest">

  <title>English Trainer</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
<header>
  <div class="wrap">

    <div class="row">
      <div>
        <h1 id="appTitle">English Trainer</h1>
        <div class="sub" id="appSubtitle"></div>
      </div>

      <div class="header-actions">
        <button
          class="btn"
          id="languageButton"
          type="button"
          aria-label="Toggle display language"
        >
          JP
        </button>

        <button
          class="btn"
          id="themeButton"
          type="button"
          aria-label="配色を切り替える"
          title="配色を切り替える"
        >
          ◐
        </button>
      </div>
    </div>

    <div class="tabs">
      <button class="btn primary" id="todayButton" type="button">
        Today
      </button>

      <button class="btn" id="wordsButton" type="button">
        Words
      </button>

      <span class="grow"></span>

      <button
        class="btn"
        id="bookmarkFilterButton"
        type="button"
        title="Bookmark filter"
      >
        ☆
      </button>

      <button class="btn" id="shuffleButton" type="button">
        ↻
      </button>
    </div>

    <div class="search-row">
      <input
        class="btn"
        id="searchInput"
        type="search"
        autocomplete="off"
      >

      <button class="btn" id="clearButton" type="button">
        ✕
      </button>
    </div>

    <div class="row screen-info">
      <div class="sub" id="screenTitle"></div>
      <div class="count" id="screenCount"></div>
    </div>

  </div>
</header>

<main class="wrap">

  <div id="errorBox" class="error hidden"></div>

  <div id="cardList" class="grid" aria-live="polite"></div>

  <footer id="installTip"></footer>

</main>

<script src="./app.js" defer></script>

</body>
</html>
