<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="./manifest.webmanifest">

  <title>English Trainer</title>

  <style>
    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #f2f2f2;
    }

    button,
    input {
      font: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      background: rgba(10, 10, 10, 0.94);
      backdrop-filter: blur(10px);

      border-bottom: 1px solid #222;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 14px 28px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .sub {
      margin-top: 5px;
      color: #aaa;
      font-size: 13px;
    }

    .btn {
      border: 1px solid #303030;
      border-radius: 10px;
      padding: 8px 11px;

      background: #1b1b1b;
      color: #fff;

      cursor: pointer;
    }

    .btn.primary {
      background: #292929;
      border-color: #444;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .grow {
      flex: 1;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .screen-info {
      margin-top: 10px;
    }

    .count {
      color: #ccc;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      padding: 13px;

      border: 1px solid #242424;
      border-radius: 14px;

      background: #121212;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .word {
      margin: 0;

      font-size: 22px;
      font-weight: 750;

      overflow-wrap: anywhere;
    }

    .ipa {
      margin-top: 5px;
      color: #ddd;
      font-size: 15px;
    }

    .ipa-label {
      margin-right: 4px;
      color: #888;
      font-size: 11px;
    }

    .speak-btn {
      margin-left: 6px;
      padding: 3px 7px;

      border: 1px solid #333;
      border-radius: 8px;

      background: transparent;
      color: #ddd;

      cursor: pointer;
    }

    .meta-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;

      color: #888;
      font-size: 12px;
    }

    .bookmark-btn {
      padding: 4px 6px;

      border: none;
      background: transparent;
      color: #ffd700;

      font-size: 20px;
      cursor: pointer;
    }

    .pill {
      display: inline-block;
      margin: 7px 6px 0 0;
      padding: 3px 8px;

      border: 1px solid #303030;
      border-radius: 999px;

      color: #ccc;
      font-size: 12px;
    }

    .grammar-line {
      margin-top: 6px;
      color: #999;
      font-size: 12px;
    }

    .label {
      margin-top: 12px;
      color: #929292;
      font-size: 12px;
    }

    .text {
      margin: 4px 0 0;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    ul.text {
      margin-top: 6px;
      padding-left: 20px;
      white-space: normal;
    }

    ul.text li {
      margin-bottom: 5px;
      white-space: pre-wrap;
    }

    .synonym-item {
      margin-top: 6px;
      line-height: 1.5;
    }

    .synonym-word {
      font-weight: 700;
    }

    .synonym-note {
      color: #aaa;
    }

    .equivalent-grid {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 6px 10px;

      margin-top: 6px;
      line-height: 1.5;
    }

    .equivalent-lang {
      color: #888;
      font-size: 12px;
    }

    .equivalent-word {
      font-weight: 650;
    }

    .score-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .score-row .btn {
      flex: 1;
      padding: 10px;
    }

    .muted {
      color: #888;
      font-size: 12px;
    }

    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .empty {
      padding: 20px 4px;
      color: #999;
    }

    .error {
      margin-top: 14px;
      padding: 12px;

      border: 1px solid #5a1a1a;
      border-radius: 12px;

      background: #2a0f0f;
      color: #ffd6d6;

      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    mark {
      padding: 0 0.12em;
      border-radius: 0.25em;

      background: rgba(255, 215, 0, 0.22);
      color: inherit;
    }

    footer {
      margin-top: 18px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">

    <div class="row">
      <div>
        <h1 id="appTitle">English Trainer</h1>
        <div class="sub" id="appSubtitle"></div>
      </div>

      <button
        class="btn"
        id="languageButton"
        type="button"
        aria-label="Toggle display language"
      >
        JP
      </button>
    </div>

    <div class="tabs">
      <button class="btn primary" id="todayButton" type="button">
        Today
      </button>

      <button class="btn" id="reviewButton" type="button">
        Review
      </button>

      <span class="grow"></span>

      <button
        class="btn"
        id="bookmarkFilterButton"
        type="button"
        title="Bookmark filter"
      >
        ☆
      </button>

      <button class="btn" id="shuffleButton" type="button">
        ↻
      </button>
    </div>

    <div class="search-row">
      <input
        class="btn"
        id="searchInput"
        type="search"
        autocomplete="off"
      >

      <button class="btn" id="clearButton" type="button">
        ✕
      </button>
    </div>

    <div class="row screen-info">
      <div class="sub" id="screenTitle"></div>
      <div class="count" id="screenCount"></div>
    </div>

  </div>
</header>

<main class="wrap">

  <div id="errorBox" class="error hidden"></div>

  <div id="cardList" class="grid" aria-live="polite"></div>

  <footer id="installTip"></footer>

</main>

<script>
  "use strict";

  // ==================================================
  // Constants
  // ==================================================

  const CARDS_VERSION = "2026-08-06-1";
  const SRS_SCHEMA_VERSION = "2026-08-06-1";

  const STORAGE = {
    language: "et_language",
    view: "et_view",
    bookmarks: "et_bookmarks",
    bookmarkOnly: "et_bookmark_only",
    seed: "et_seed",
    srs: "et_srs",
    srsSchema: "et_srs_schema"
  };

  const UI = {
    ja: {
      title: "English Trainer",
      subtitle: "個人用 / PWA / JP⇄EN表示切替",

      todayTab: "Today",
      reviewTab: "Review",

      todayTitle: "今日の5語",
      reviewTitle: "復習（期限到来）",
      searchTitle: "検索結果",

      shuffle: "シャッフル",

      searchPlaceholder:
        "検索（例: thrive / 繁栄 / gedeihen / prospérer）",

      meaning: "意味",
      nuance: "語感・ニュアンス",
      minimal: "最小対立（近い語との違い）",
      etymology: "語源",
      synonyms: "類義語",
      equivalents: "他言語の相当語",
      collocations: "コロケーション",
      examples: "例文",

      due: "復習期限",
      score: "自己採点",

      bad: "ダメ",
      unsure: "微妙",
      good: "覚えた",

      saved: "記録しました",

      noCards: "該当するカードがありません。",
      noReview: "現在、復習期限を迎えたカードはありません。",

      install:
        "Tip: iPhone Safari → 共有 → ホーム画面に追加",

      us: "米",
      uk: "英",

      freq: {
        often: "頻出",
        sometimes: "時々",
        rare: "稀"
      },

      tags: {
        core: "基本",
        business: "ビジネス",
        academic: "学術",
        formal: "硬め",
        coll: "コロケ"
      }
    },

    en: {
      title: "English Trainer",
      subtitle: "Private / PWA / JP⇄EN display",

      todayTab: "Today",
      reviewTab: "Review",

      todayTitle: "Today's 5 words",
      reviewTitle: "Review due",
      searchTitle: "Search results",

      shuffle: "Shuffle",

      searchPlaceholder:
        "Search (e.g. thrive / flourish / gedeihen / prosperar)",

      meaning: "Meaning",
      nuance: "Nuance and usage",
      minimal: "Minimal contrast",
      etymology: "Etymology",
      synonyms: "Synonyms",
      equivalents: "Equivalents",
      collocations: "Collocations",
      examples: "Examples",

      due: "Due",
      score: "Self-assessment",

      bad: "Again",
      unsure: "Unsure",
      good: "Good",

      saved: "Saved",

      noCards: "No matching cards.",
      noReview: "Nothing is currently due for review.",

      install:
        "Tip: iPhone Safari → Share → Add to Home Screen",

      us: "US",
      uk: "UK",

      freq: {
        often: "frequent",
        sometimes: "occasional",
        rare: "rare"
      },

      tags: {
        core: "core",
        business: "business",
        academic: "academic",
        formal: "formal",
        coll: "collocation"
      }
    }
  };

  let CARDS = [];
  let QUERY = "";

  // ==================================================
  // Basic utilities
  // ==================================================

  function isString(value) {
    return typeof value === "string";
  }

  function isNonEmptyString(value) {
    return isString(value) && value.trim().length > 0;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeRegExp(value) {
    return String(value).replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
  }

  function normalizeText(value) {
    if (Array.isArray(value)) {
      return value
        .filter(isString)
        .map(item => item.trim())
        .filter(Boolean);
    }

    if (isString(value) && value.trim()) {
      return [value.trim()];
    }

    return [];
  }

  function getLanguage() {
    return localStorage.getItem(STORAGE.language) || "ja";
  }

  function setLanguage(language) {
    localStorage.setItem(STORAGE.language, language);
  }

  function getView() {
    return localStorage.getItem(STORAGE.view) || "today";
  }

  function setView(view) {
    localStorage.setItem(STORAGE.view, view);
  }

  function text(key) {
    return UI[getLanguage()][key] ?? key;
  }

  function highlight(value) {
    const source = String(value);
    const query = QUERY.trim();

    if (query.length < 2) {
      return escapeHtml(source);
    }

    const expression = new RegExp(
      escapeRegExp(query),
      "ig"
    );

    let marked = source.replace(
      expression,
      match => `__MARK_OPEN__${match}__MARK_CLOSE__`
    );

    marked = escapeHtml(marked);

    return marked
      .replaceAll("__MARK_OPEN__", "<mark>")
      .replaceAll("__MARK_CLOSE__", "</mark>");
  }

  // ==================================================
  // Validation
  // ==================================================

  function isLocalizedBlock(value) {
    if (value === undefined || value === null) {
      return true;
    }

    if (
      typeof value !== "object" ||
      Array.isArray(value)
    ) {
      return false;
    }

    for (const language of ["ja", "en"]) {
      const item = value[language];

      if (
        item !== undefined &&
        !isString(item) &&
        !(
          Array.isArray(item) &&
          item.every(isString)
        )
      ) {
        return false;
      }
    }

    return true;
  }

  function validateCards(cards) {
    const errors = [];
    const ids = new Set();
    const sids = new Set();

    if (!Array.isArray(cards)) {
      return {
        ok: false,
        errors: ["cards.json must contain an array."]
      };
    }

    cards.forEach((card, index) => {
      const number = index + 1;
      const prefix = `Card #${number}`;

      if (
        !card ||
        typeof card !== "object" ||
        Array.isArray(card)
      ) {
        errors.push(`${prefix}: invalid object`);
        return;
      }

      if (!isNonEmptyString(card.id)) {
        errors.push(`${prefix}: id is required`);
      }

      if (!isNonEmptyString(card.sid)) {
        errors.push(`${prefix}: sid is required`);
      }

      if (!isNonEmptyString(card.word)) {
        errors.push(`${prefix}: word is required`);
      }

      if (
        isNonEmptyString(card.sid) &&
        !/^\d{4}-\d{5}$/.test(card.sid)
      ) {
        errors.push(
          `${prefix}: sid must use YYYY-00000 format`
        );
      }

      if (ids.has(card.id)) {
        errors.push(`${prefix}: duplicate id "${card.id}"`);
      }

      if (sids.has(card.sid)) {
        errors.push(`${prefix}: duplicate sid "${card.sid}"`);
      }

      ids.add(card.id);
      sids.add(card.sid);

      for (
        const field of [
          "meaning",
          "nuance",
          "minimal",
          "etymology",
          "collocations",
          "example"
        ]
      ) {
        if (!isLocalizedBlock(card[field])) {
          errors.push(
            `${prefix}: ${field} must contain ja/en`
          );
        }
      }

      if (
        card.synonyms !== undefined &&
        !Array.isArray(card.synonyms)
      ) {
        errors.push(
          `${prefix}: synonyms must be an array`
        );
      }

      if (
        card.equivalents !== undefined &&
        (
          typeof card.equivalents !== "object" ||
          Array.isArray(card.equivalents)
        )
      ) {
        errors.push(
          `${prefix}: equivalents must be an object`
        );
      }
    });

    return {
      ok: errors.length === 0,
      errors
    };
  }

  // ==================================================
  // Loading
  // ==================================================

  async function loadCards() {
    try {
      const files = [
  "./cards.json",
  "./cards2.json",
  "./cards3.json",
  "./cards4.json"
];

const allCards = [];

for (const file of files) {
  const response = await fetch(
    `${file}?v=${encodeURIComponent(CARDS_VERSION)}`,
    {
      cache: "no-store"
    }
  );

  if (!response.ok) {
    throw new Error(
      `${file}: HTTP ${response.status}`
    );
  }

  const data = await response.json();

  if (!Array.isArray(data)) {
    throw new Error(
      `${file} is not a JSON array`
    );
  }

  allCards.push(...data);
}

const result = validateCards(allCards);

      if (!result.ok) {
        CARDS = [];

        showError(
          "cards.json に問題があります。\n\n" +
          result.errors
            .map(error => `・${error}`)
            .join("\n")
        );

        return;
      }

      CARDS = allCards;
      hideError();
    } catch (error) {
      console.error(error);

      CARDS = [];

      showError(
        "cards.json を読み込めませんでした。\n\n" +
        "次を確認してください。\n" +
        "・cards.json が index.html と同じ階層にある\n" +
        "・JSONの末尾カンマや引用符に誤りがない\n" +
        "・GitHub Pagesの反映が完了している"
      );
    }
  }

  function showError(message) {
    const element = document.getElementById("errorBox");

    element.innerHTML = escapeHtml(message)
      .replaceAll("\n", "<br>");

    element.classList.remove("hidden");
  }

  function hideError() {
    const element = document.getElementById("errorBox");

    element.classList.add("hidden");
    element.innerHTML = "";
  }

  // ==================================================
  // Bookmarks
  // ==================================================

  function loadBookmarks() {
    try {
      const value = JSON.parse(
        localStorage.getItem(STORAGE.bookmarks) || "[]"
      );

      return Array.isArray(value)
        ? value.filter(isNonEmptyString)
        : [];
    } catch {
      return [];
    }
  }

  function saveBookmarks(bookmarks) {
    localStorage.setItem(
      STORAGE.bookmarks,
      JSON.stringify(bookmarks)
    );
  }

  function hasBookmark(id) {
    return loadBookmarks().includes(id);
  }

  function toggleBookmark(id) {
    const bookmarks = loadBookmarks();
    const index = bookmarks.indexOf(id);

    if (index >= 0) {
      bookmarks.splice(index, 1);
    } else {
      bookmarks.push(id);
    }

    saveBookmarks(bookmarks);

    return bookmarks.includes(id);
  }

  function getBookmarkOnly() {
    return (
      localStorage.getItem(STORAGE.bookmarkOnly) === "1"
    );
  }

  function setBookmarkOnly(value) {
    localStorage.setItem(
      STORAGE.bookmarkOnly,
      value ? "1" : "0"
    );
  }

  function updateBookmarkButton(visibleCount) {
    const button = document.getElementById(
      "bookmarkFilterButton"
    );

    const total = loadBookmarks().length;

    button.textContent = getBookmarkOnly()
      ? `★ ${visibleCount ?? total}/${total}`
      : `☆ ${total}`;
  }

  // ==================================================
  // Search
  // ==================================================

  function flattenLocalized(value) {
    if (!value || typeof value !== "object") {
      return [];
    }

    return Object.values(value).flatMap(normalizeText);
  }

  function cardSearchText(card) {
    const synonyms = Array.isArray(card.synonyms)
      ? card.synonyms.flatMap(item => [
          item.word,
          ...flattenLocalized(item.note)
        ])
      : [];

    return [
      card.word,
      card.level,
      card.freq,

      ...(card.tags || []),

      card.pronunciation?.ipa?.us,
      card.pronunciation?.ipa?.uk,

      ...flattenLocalized(card.meaning),
      ...flattenLocalized(card.nuance),
      ...flattenLocalized(card.minimal),
      ...flattenLocalized(card.etymology),
      ...flattenLocalized(card.collocations),
      ...flattenLocalized(card.example),

      ...synonyms,

      card.equivalents?.de,
      card.equivalents?.it,
      card.equivalents?.fr,
      card.equivalents?.es
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();
  }

  function filterCards(cards) {
    const query = QUERY.trim().toLowerCase();

    if (!query) {
      return cards;
    }

    return cards.filter(card =>
      cardSearchText(card).includes(query)
    );
  }

  // ==================================================
  // Seeded shuffle
  // ==================================================

  function todaySeed() {
    const date = new Date();

    return Number(
      [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("")
    );
  }

  function getSeed() {
    let seed = localStorage.getItem(STORAGE.seed);

    if (!seed) {
      seed = String(todaySeed());
      localStorage.setItem(STORAGE.seed, seed);
    }

    return Number(seed);
  }

  function rotateSeed() {
    localStorage.setItem(
      STORAGE.seed,
      String(Math.floor(Math.random() * 1_000_000_000))
    );
  }

  function seededShuffle(items, seed) {
    const result = items.slice();
    let value = seed;

    for (
      let index = result.length - 1;
      index > 0;
      index -= 1
    ) {
      value =
        (value * 1664525 + 1013904223) %
        4294967296;

      const randomIndex = value % (index + 1);

      [
        result[index],
        result[randomIndex]
      ] = [
        result[randomIndex],
        result[index]
      ];
    }

    return result;
  }

  // ==================================================
  // SRS
  // ==================================================

  function resetSrsWhenNeeded() {
    const previous = localStorage.getItem(
      STORAGE.srsSchema
    );

    if (previous !== SRS_SCHEMA_VERSION) {
      localStorage.removeItem(STORAGE.srs);

      localStorage.setItem(
        STORAGE.srsSchema,
        SRS_SCHEMA_VERSION
      );
    }
  }

  function beginningOfToday() {
    const date = new Date();
    date.setHours(0, 0, 0, 0);

    return date.getTime();
  }

  function formatDate(milliseconds) {
    const date = new Date(milliseconds);

    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function loadSrs() {
    try {
      return JSON.parse(
        localStorage.getItem(STORAGE.srs) || "{}"
      );
    } catch {
      return {};
    }
  }

  function saveSrs(state) {
    localStorage.setItem(
      STORAGE.srs,
      JSON.stringify(state)
    );
  }

  function ensureSrsCard(state, id) {
    if (!state[id]) {
      state[id] = {
        intervalDays: 1,
        due: beginningOfToday()
      };
    }

    return state[id];
  }

  function getCardDue(id) {
    const state = loadSrs();
    const cardState = ensureSrsCard(state, id);

    saveSrs(state);

    return cardState.due;
  }

  function getDueCards() {
    const state = loadSrs();
    const today = beginningOfToday();

    const dueCards = CARDS.filter(card => {
      const cardState = ensureSrsCard(
        state,
        card.id
      );

      return cardState.due <= today;
    });

    saveSrs(state);

    return dueCards;
  }

  function applyScore(id, score) {
    const state = loadSrs();
    const cardState = ensureSrsCard(state, id);
    const today = beginningOfToday();

    if (score === "good") {
      cardState.intervalDays = Math.max(
        2,
        Math.round(cardState.intervalDays * 2.2)
      );
    } else if (score === "unsure") {
      cardState.intervalDays = Math.max(
        1,
        Math.round(cardState.intervalDays * 1.3)
      );
    } else {
      cardState.intervalDays = 1;
    }

    cardState.due =
      today +
      cardState.intervalDays *
      24 *
      60 *
      60 *
      1000;

    state[id] = cardState;
    saveSrs(state);
  }

  // ==================================================
  // Formatting
  // ==================================================

  function partOfSpeechLabel(partOfSpeech) {
    const labels = {
      noun: "N",
      verb: "V",
      adj: "Adj",
      adv: "Adv",
      prep: "Prep",
      conj: "Conj",
      pron: "Pron",
      phrase: "Phrase"
    };

    return labels[partOfSpeech] || "";
  }

  function frequencyLabel(frequency) {
    return (
      UI[getLanguage()].freq[frequency] ||
      frequency ||
      ""
    );
  }

  function tagLabel(tag) {
    return UI[getLanguage()].tags[tag] || tag;
  }

  function grammarLine(grammar) {
    if (!grammar) {
      return "";
    }

    if (grammar.pos === "verb") {
      return [
        grammar.forms,
        grammar.transitivity
      ]
        .filter(Boolean)
        .join(" / ");
    }

    if (grammar.pos === "noun") {
      return [
        grammar.countability,
        grammar.plural
          ? `pl. ${grammar.plural}`
          : ""
      ]
        .filter(Boolean)
        .join(" / ");
    }

    return "";
  }

  function renderPills(card) {
    const values = [];

    const partOfSpeech = partOfSpeechLabel(
      card.grammar?.pos
    );

    if (partOfSpeech) {
      values.push(partOfSpeech);
    }

    if (card.level) {
      values.push(card.level);
    }

    if (card.freq) {
      values.push(
        frequencyLabel(card.freq)
      );
    }

    for (const tag of card.tags || []) {
      values.push(tagLabel(tag));
    }

    return values
      .map(
        value =>
          `<span class="pill">${escapeHtml(value)}</span>`
      )
      .join("");
  }

  function renderTextBlock(label, values, className = "") {
    const lines = normalizeText(values);

    if (!lines.length) {
      return "";
    }

    if (lines.length === 1) {
      return `
        <div class="label">${escapeHtml(label)}</div>
        <p class="text ${className}">
          ${highlight(lines[0])}
        </p>
      `;
    }

    return `
      <div class="label">${escapeHtml(label)}</div>

      <ul class="text ${className}">
        ${lines
          .map(
            line => `<li>${highlight(line)}</li>`
          )
          .join("")}
      </ul>
    `;
  }

  function renderPronunciation(card) {
    const ipa = card.pronunciation?.ipa || {};
    const parts = [];

    if (isNonEmptyString(ipa.us)) {
      parts.push(`
        <span>
          <span class="ipa-label">${escapeHtml(text("us"))}</span>
          ${escapeHtml(ipa.us)}
        </span>
      `);
    }

    if (
      isNonEmptyString(ipa.uk) &&
      ipa.uk !== ipa.us
    ) {
      parts.push(`
        <span>
          <span class="ipa-label">${escapeHtml(text("uk"))}</span>
          ${escapeHtml(ipa.uk)}
        </span>
      `);
    }

    if (!parts.length) {
      return "";
    }

    return `
      <div class="ipa mono">
        ${parts.join(" &nbsp; ")}

        <button
          class="speak-btn"
          type="button"
          data-speak="${escapeHtml(card.word)}"
          aria-label="Pronounce"
        >
          🔊
        </button>
      </div>
    `;
  }

  function renderSynonyms(card) {
    if (
      !Array.isArray(card.synonyms) ||
      !card.synonyms.length
    ) {
      return "";
    }

    const language = getLanguage();

    const rows = card.synonyms
      .map(item => {
        const note = normalizeText(
          item.note?.[language]
        ).join(" ");

        return `
          <div class="synonym-item">
            <span class="synonym-word">
              ${highlight(item.word)}
            </span>

            ${
              note
                ? `<span class="synonym-note">
                    — ${highlight(note)}
                  </span>`
                : ""
            }
          </div>
        `;
      })
      .join("");

    return `
      <div class="label">${escapeHtml(text("synonyms"))}</div>
      <div>${rows}</div>
    `;
  }

  function renderEquivalents(card) {
    const equivalents = card.equivalents || {};
    const rows = [];

    const languages = [
      ["de", "Deutsch"],
      ["it", "Italiano"],
      ["fr", "Français"],
      ["es", "Español"]
    ];

    for (const [key, label] of languages) {
      if (isNonEmptyString(equivalents[key])) {
        rows.push(`
          <div class="equivalent-lang">
            ${escapeHtml(label)}
          </div>

          <div class="equivalent-word">
            ${highlight(equivalents[key])}
          </div>
        `);
      }
    }

    if (!rows.length) {
      return "";
    }

    return `
      <div class="label">
        ${escapeHtml(text("equivalents"))}
      </div>

      <div class="equivalent-grid">
        ${rows.join("")}
      </div>
    `;
  }

  // ==================================================
  // Speech
  // ==================================================

  function speak(word) {
    if (
      !("speechSynthesis" in window) ||
      !isNonEmptyString(word)
    ) {
      return;
    }

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(word);

    utterance.lang = "en-US";
    utterance.rate = 0.85;

    window.speechSynthesis.speak(utterance);
  }

  // ==================================================
  // Rendering
  // ==================================================

  function renderCard(card, mode) {
    const language = getLanguage();

    const element =
      document.createElement("section");

    element.className = "card";

    element.innerHTML = `
      <div class="card-top">

        <div class="card-main">

          <h2 class="word">
            ${highlight(card.word)}
          </h2>

          ${renderPronunciation(card)}

          <div>
            ${renderPills(card)}
          </div>

          ${
            grammarLine(card.grammar)
              ? `
                <div class="grammar-line">
                  ${escapeHtml(
                    grammarLine(card.grammar)
                  )}
                </div>
              `
              : ""
          }

        </div>

        <div class="meta-right">

          <div>
            ${escapeHtml(text("due"))}:
            <span class="mono">
              ${formatDate(getCardDue(card.id))}
            </span>
          </div>

          <button
            class="bookmark-btn"
            type="button"
            data-bookmark="${escapeHtml(card.id)}"
            aria-label="Bookmark"
          >
            ${hasBookmark(card.id) ? "★" : "☆"}
          </button>

          <div class="mono">
            ${escapeHtml(card.sid)}
          </div>

        </div>

      </div>

      ${renderTextBlock(
        text("meaning"),
        card.meaning?.[language]
      )}

      ${renderTextBlock(
        text("nuance"),
        card.nuance?.[language]
      )}
　　　　${renderTextBlock(
        text("minimal"),
        card.minimal?.[language]
　　　　)}
      ${renderTextBlock(
        text("etymology"),
        card.etymology?.[language]
      )}

      ${renderSynonyms(card)}

      ${renderEquivalents(card)}

      ${renderTextBlock(
        text("collocations"),
        card.collocations?.[language],
        "mono"
      )}

      ${renderTextBlock(
        text("examples"),
        card.example?.[language],
        "mono"
      )}

      ${
        mode === "review"
          ? `
            <div class="label">
              ${escapeHtml(text("score"))}
            </div>

            <div class="score-row">

              <button
                class="btn"
                type="button"
                data-score="bad"
              >
                ${escapeHtml(text("bad"))}
              </button>

              <button
                class="btn"
                type="button"
                data-score="unsure"
              >
                ${escapeHtml(text("unsure"))}
              </button>

              <button
                class="btn"
                type="button"
                data-score="good"
              >
                ${escapeHtml(text("good"))}
              </button>

            </div>

            <div
              class="muted"
              data-score-status
              style="margin-top:8px"
            ></div>
          `
          : ""
      }
    `;

    element
      .querySelectorAll("[data-speak]")
      .forEach(button => {
        button.addEventListener(
          "click",
          () => speak(
            button.getAttribute("data-speak")
          )
        );
      });

    const bookmarkButton =
      element.querySelector("[data-bookmark]");

    bookmarkButton.addEventListener("click", () => {
      const bookmarked = toggleBookmark(card.id);

      bookmarkButton.textContent =
        bookmarked ? "★" : "☆";

      updateBookmarkButton();

      if (getBookmarkOnly()) {
        render();
      }
    });

    if (mode === "review") {
      const status =
        element.querySelector(
          "[data-score-status]"
        );

      element
        .querySelectorAll("[data-score]")
        .forEach(button => {
          button.addEventListener("click", () => {
            const score =
              button.getAttribute("data-score");

            applyScore(card.id, score);

            status.textContent =
              `${text("saved")} → ` +
              `${text("due")}: ` +
              `${formatDate(getCardDue(card.id))}`;

            setTimeout(render, 300);
          });
        });
    }

    return element;
  }

  function updateScreenCount(visible) {
    const total = CARDS.length;
    const bookmarks = loadBookmarks().length;

    document.getElementById(
      "screenCount"
    ).textContent = total
      ? `${visible} / ${total}` +
        (bookmarks ? `（★${bookmarks}）` : "")
      : "";
  }

  function render() {
    const language = getLanguage();
    const view = getView();

    document.documentElement.lang =
      language === "ja" ? "ja" : "en";

    document.getElementById(
      "appTitle"
    ).textContent = text("title");

    document.getElementById(
      "appSubtitle"
    ).textContent = text("subtitle");

    document.getElementById(
      "languageButton"
    ).textContent =
      language === "ja" ? "JP" : "EN";

    document.getElementById(
      "todayButton"
    ).textContent = text("todayTab");

    document.getElementById(
      "reviewButton"
    ).textContent = text("reviewTab");

    document.getElementById(
      "shuffleButton"
    ).textContent = `↻ ${text("shuffle")}`;

    document.getElementById(
      "searchInput"
    ).placeholder =
      text("searchPlaceholder");

    document.getElementById(
      "installTip"
    ).textContent = text("install");

    document.getElementById(
      "todayButton"
    ).classList.toggle(
      "primary",
      view === "today"
    );

    document.getElementById(
      "reviewButton"
    ).classList.toggle(
      "primary",
      view === "review"
    );

    const list =
      document.getElementById("cardList");

    list.innerHTML = "";

    let cards =
      view === "review"
        ? getDueCards()
        : CARDS;

    cards = filterCards(cards);

    if (getBookmarkOnly()) {
      cards = cards.filter(card =>
        hasBookmark(card.id)
      );
    }

    document.getElementById(
      "screenTitle"
    ).textContent = QUERY
      ? text("searchTitle")
      : view === "review"
        ? text("reviewTitle")
        : text("todayTitle");

    if (view === "today") {
  if (QUERY) {
    const needle = QUERY.trim().toLowerCase();

    // 検索中は全件表示し、
    // 単語そのものが完全一致するカードを先頭へ
    cards = [...cards].sort((a, b) => {
      const aWord = String(a.word || "").trim().toLowerCase();
      const bWord = String(b.word || "").trim().toLowerCase();

      const aExact = aWord === needle;
      const bExact = bWord === needle;

      if (aExact && !bExact) return -1;
      if (!aExact && bExact) return 1;

      return aWord.localeCompare(bWord);
    });
  } else {
    // 通常の Today は従来どおり5枚
    cards = seededShuffle(
      cards,
      getSeed()
    ).slice(0, 5);
  }
}

    if (!cards.length) {
      list.innerHTML = `
        <div class="empty">
          ${
            view === "review" && !QUERY
              ? escapeHtml(text("noReview"))
              : escapeHtml(text("noCards"))
          }
        </div>
      `;

      updateScreenCount(0);
      updateBookmarkButton(0);

      return;
    }

    for (const card of cards) {
      list.appendChild(
        renderCard(card, view)
      );
    }

    updateScreenCount(cards.length);
    updateBookmarkButton(cards.length);
  }

  // ==================================================
  // Events
  // ==================================================

  document.getElementById(
    "languageButton"
  ).addEventListener("click", () => {
    setLanguage(
      getLanguage() === "ja" ? "en" : "ja"
    );

    render();
  });

  document.getElementById(
    "todayButton"
  ).addEventListener("click", () => {
    setView("today");
    render();
  });

  document.getElementById(
    "reviewButton"
  ).addEventListener("click", () => {
    setView("review");
    render();
  });

  document.getElementById(
    "shuffleButton"
  ).addEventListener("click", () => {
    rotateSeed();
    render();
  });

  document.getElementById(
    "bookmarkFilterButton"
  ).addEventListener("click", () => {
    setBookmarkOnly(!getBookmarkOnly());
    render();
  });

  const searchInput =
    document.getElementById("searchInput");

  searchInput.addEventListener("input", () => {
    QUERY = searchInput.value.trim();
    render();
  });

  document.getElementById(
    "clearButton"
  ).addEventListener("click", () => {
    searchInput.value = "";
    QUERY = "";

    render();
    searchInput.focus();
  });

  // ==================================================
  // Service worker
  // ==================================================

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        await navigator.serviceWorker.register(
          "./sw.js"
        );
      } catch (error) {
        console.warn(
          "Service worker registration failed.",
          error
        );
      }
    });
  }

  // ==================================================
  // Boot
  // ==================================================

  resetSrsWhenNeeded();

  (async () => {
    await loadCards();
    render();
  })();
</script>

</body>
</html>
